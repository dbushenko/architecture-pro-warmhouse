name: PlantUML Diagrams

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

jobs:
  generate-diagrams:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Install PlantUML
      run: sudo apt-get install plantuml
        
    - name: Generate Diagrams
      run: |
        java -jar diagrams/plantuml.jar diagrams/context/*.puml
        java -jar diagrams/plantuml.jar diagrams/container/*.puml
        java -jar diagrams/plantuml.jar diagrams/component/*.puml
        java -jar diagrams/plantuml.jar diagrams/code/*.puml

    - name: Commit Diagrams
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add diagrams/**/*.png
        git commit -m "Automated diagram generation"
        git push origin main
      if: success()
