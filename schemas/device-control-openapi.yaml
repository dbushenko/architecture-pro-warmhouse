openapi: 3.0.3
info:
  title: "Device Controller API"
  description: "API for controlling smart home devices"
  version: "1.0.0"
servers:
  - url: "http://localhost:3000"
    description: "Local development server"

paths:
  /health:
    get:
      summary: "Health check"
      description: "Check if the API is running"
      responses:
        "200":
          description: "API is running"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /query:
    get:
      summary: "Query device status"
      description: "Retrieves status or data from a device."
      parameters:
        - name: type
          in: query
          required: true
          description: "Device type."
          schema:
            type: string
            enum: [temp, light, lock]
        - name: sensorId
          in: query
          required: false
          description: "Sensor ID (for temp)."
          schema:
            type: string
        - name: deviceId
          in: query
          required: false
          description: "Device ID (for light/lock)."
          schema:
            type: string
      responses:
        "200":
          description: "Successful response."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/TempQueryResponse"
                  - $ref: "#/components/schemas/LightQueryResponse"
                  - $ref: "#/components/schemas/LockQueryResponse"
        "400":
          description: "Invalid parameters."
        "500":
          description: "Internal server error."

  /command:
    post:
      summary: "Send a command"
      description: "Sends a command to a device."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/TempCommand"
                - $ref: "#/components/schemas/TempPatchCommand"
                - $ref: "#/components/schemas/LightCommand"
                - $ref: "#/components/schemas/LockCommand"
              discriminator:
                propertyName: type
      responses:
        "200":
          description: "Command sent."
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Command processed"
        "400":
          description: "Invalid command format."
        "500":
          description: "Internal server error."

components:
  schemas:
    TempCommand:
      type: object
      required:
        - type
        - deviceId
        - command
      properties:
        type:
          type: string
          enum: [temp]
        deviceId:
          type: string
          description: "Temperature device ID."
        command:
          type: string
          description: "Command for temperature device."
          enum: [set_temperature, get_status]
        targetTemperature:
          type: number
          format: float
          description: "Target temperature (for 'set_temperature')."
      example:
        type: "temp"
        deviceId: "thermostat-123"
        command: "set_temperature"
        targetTemperature: 22.5

    LightCommand:
      type: object
      required:
        - type
        - deviceId
        - command
      properties:
        type:
          type: string
          enum: [light]
        deviceId:
          type: string
          description: "Light device ID."
        command:
          type: string
          description: "Command for light device."
          enum: [turn_on, turn_off, get_status]
      additionalProperties: true
      example:
        type: "light"
        deviceId: "light-abc"
        command: "turn_on"
        brightness: 75

    LockCommand:
      type: object
      required:
        - type
        - deviceId
        - command
      properties:
        type:
          type: string
          enum: [lock]
        deviceId:
          type: string
          description: "Lock device ID."
        command:
          type: string
          description: "Command for lock device."
          enum: [lock, unlock, get_status]
      example:
        type: "lock"
        deviceId: "door-lock-xyz"
        command: "lock"

    TempPatchCommand:
      type: object
      required:
        - type
        - deviceId
        - value
        - status
      properties:
        type:
          type: string
          enum: [temp]
        deviceId:
          type: string
          description: "Temperature device ID."
        value:
          type: number
          format: float
          description: "Temperature value."
        status:
          type: string
          description: "Device status."
      example:
        type: "temp"
        deviceId: "temp-001"
        value: 22.5
        status: "active"

    TempQueryResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        type:
          type: string
        location:
          type: string
        value:
          type: number
          format: float
        unit:
          type: string
        status:
          type: string
        last_updated:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    LightQueryResponse:
      type: object
      properties:
        deviceId:
          type: string
        type:
          type: string
          enum: [LIGHT]
        status:
          type: string
          enum: [ON, OFF]
        brightness:
          type: integer
          minimum: 0
          maximum: 100

    LockQueryResponse:
      type: object
      properties:
        deviceId:
          type: string
        type:
          type: string
          enum: [LOCK]
        status:
          type: string
          enum: [LOCKED, UNLOCKED]
